name: Build and Deploy Full Stack App (Gradle + Vite + SCP)

on:
  pull_request:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Backend ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./backend/gradlew

      - name: Build backend with Gradle
        working-directory: ./backend
        run: ./gradlew clean build

      # ---------- Frontend ----------
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./front
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: ./front
        run: npm run build

      # ---------- Deploy ----------
      - name: Install dependencies (sshpass, scp, ssh)
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client sshpass

      - name: Deploy backend JAR and frontend build via SCP
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_PATH: ${{ secrets.SERVER_PATH }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          # Backend JAR
          BACKEND_JAR=$(ls backend/build/libs/*.jar)

          echo "Deploying backend..."
          sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P $SERVER_PORT "$BACKEND_JAR" "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}"

          # Frontend dist
          echo "Deploying frontend..."
          sshpass -p "$SERVER_PASSWORD" scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P $SERVER_PORT front/dist/* "${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/public_html/build/"
