openapi: 3.0.3
info:
  title: Flat API
  description: API для управления квартирами
  version: 1.0.0

components:
  schemas:
    FlatDto:
      type: object
      required:
        - name
        - coordinates
        - area
        - price
        - numberOfRooms
        - floor
        - transport
        - house
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          example: 1
          description: Уникальный идентификатор квартиры, генерируется автоматически
        name:
          type: string
          minLength: 1
          example: "Cozy apartment"
          description: Название квартиры, не может быть пустым
        coordinates:
          $ref: '#/components/schemas/CoordinatesDto'
        creationDate:
          type: string
          format: date-time
          nullable: true
          description: Дата создания квартиры, генерируется автоматически
        area:
          type: number
          format: float
          exclusiveMinimum: 0
          example: 65.5
          description: Площадь квартиры, должна быть больше 0
        price:
          type: integer
          format: int64
          minimum: 1
          example: 5000000
          description: Цена квартиры, должна быть больше 0
        balcony:
          type: boolean
          nullable: true
          description: Наличие балкона, может быть null
        timeToMetroOnFoot:
          type: number
          format: float
          exclusiveMinimum: 0
          nullable: true
          example: 15.5
          description: Время до метро пешком, должно быть больше 0
        numberOfRooms:
          type: integer
          minimum: 1
          maximum: 20
          example: 3
          description: Количество комнат, должно быть больше 0 и не больше 20
        floor:
          type: integer
          minimum: 1
          example: 5
          description: Этаж квартиры, должен быть больше 0
        centralHeating:
          type: boolean
          description: Наличие центрального отопления
        transport:
          $ref: '#/components/schemas/Transport'
        house:
          $ref: '#/components/schemas/HouseDto'

    HouseDto:
      type: object
      required:
        - name
        - year
        - numberOfFlatsOnFloor
        - numberOfLifts
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Уникальный идентификатор дома, может быть null
        name:
          type: string
          minLength: 1
          example: "Sky House"
          description: Название дома
        year:
          type: integer
          format: int64
          minimum: 1
          example: 2015
          description: Год постройки дома, должен быть больше 0
        numberOfFlatsOnFloor:
          type: integer
          minimum: 1
          example: 10
          description: Количество квартир на этаже, должно быть больше 0
        numberOfLifts:
          type: integer
          minimum: 1
          example: 2
          description: Количество лифтов, должно быть больше 0

    CoordinatesDto:
      type: object
      required:
        - x
        - y
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Уникальный идентификатор координат, может быть null
        x:
          type: number
          format: float
          example: 12.3
          description: Координата X, не может быть null
        y:
          type: integer
          format: int64
          minimum: -165
          example: -100
          description: Координата Y, должна быть больше -166

    Transport:
      type: string
      enum:
        - NONE
        - FEW
        - NORMAL
        - A_LOT
      description: Уровень транспортной доступности

paths:
  /flats:
    get:
      summary: Получить список всех квартир
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlatDto'
    post:
      summary: Создать новую квартиру
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlatDto'
      responses:
        '201':
          description: Квартира успешно создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatDto'

  /flats/{id}:
    get:
      summary: Получить квартиру по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatDto'
        '404':
          description: Квартира не найдена
    put:
      summary: Обновить квартиру
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlatDto'
      responses:
        '200':
          description: Квартира успешно обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlatDto'
        '404':
          description: Квартира не найдена
    delete:
      summary: Удалить квартиру
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Квартира успешно удалена
        '404':
          description: Квартира не найдена
